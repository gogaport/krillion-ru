name = "krillion-feedback-bot"
main = "worker.js"
compatibility_date = "2026-01-01"

# Секреты НЕ хранятся в этом файле.
# Задайте их командой:
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put ADMIN_CHAT_ID
#   npx wrangler secret put WEBHOOK_SECRET   # (необязательно, но рекомендуется для /webhook)
# или через Cloudflare Dashboard -> Workers -> Settings -> Variables and Secrets.

# KV-хранилище для ответов игрокам прямо на сайте (см. bot/README.md).
# Если деплоите через wrangler, создайте namespace командой:
#   npx wrangler kv namespace create REPORTS_KV
# и раскомментируйте блок ниже, подставив выданный id:
#
# [[kv_namespaces]]
# binding = "REPORTS_KV"
# id = "YOUR_KV_NAMESPACE_ID"
